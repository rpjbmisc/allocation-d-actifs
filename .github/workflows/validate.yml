name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: One-off ETF provider audit for research PR
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/lookthrough-styles-quality-2026'
        continue-on-error: true
        run: python3 scripts/refresh_holdings_audit.py --output holdings-audit.json
      - name: Preserve audited derived summary
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/lookthrough-styles-quality-2026' && hashFiles('holdings-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: holdings-audit-validation
          path: holdings-audit.json
          retention-days: 7
